<!DOCTYPE html>
<html lang="zh-CN"> <!-- Changed language to Chinese -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title> <!-- Changed title -->
    <!-- Google Font: Poppins (Keeping for potential compatibility, though less relevant for Chinese) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary-color: #6a5af9; /* A nice purple/blue */
            --primary-hover: #5444d4;
            --background-gradient-start: #e0eafc;
            --background-gradient-end: #f0f4f9;
            --text-dark: #333;
            --text-light: #666;
            --border-color: #ddd;
            --input-bg: #fdfdfd;
            --white: #fff;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            /* Consider adding a Chinese font-family first */
            font-family: 'Poppins', sans-serif, 'Microsoft YaHei', 'SimSun', sans-serif;
            /* Subtle gradient background */
            background: linear-gradient(135deg, var(--background-gradient-start), var(--background-gradient-end));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            background-color: var(--white);
            padding: 40px; /* Increased padding */
            border-radius: 12px; /* Softer edges */
            box-shadow: 0 5px 20px var(--shadow-color); /* Softer shadow */
            width: 350px; /* Slightly wider */
            text-align: center;
            transition: transform 0.3s ease; /* Add subtle transition for potential interactions */
        }

        h2 {
            margin-bottom: 25px;
            color: var(--text-dark);
            font-weight: 600; /* Bolder title */
        }

        .form-group {
            margin-bottom: 20px; /* Increased spacing */
            text-align: left;
            position: relative; /* Needed for icon positioning */
        }

        .form-group label {
            display: block;
            margin-bottom: 8px; /* Increased spacing */
            color: var(--text-light);
            font-weight: 500; /* Medium weight */
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 40px; /* Add padding-left for icon */
            border: 1px solid var(--border-color);
            border-radius: 6px; /* Slightly softer radius */
            box-sizing: border-box;
            font-size: 1em;
            background-color: var(--input-bg);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Style for input icons */
        .form-group i {
            position: absolute;
            left: 15px;
            top: 70%; /* Adjust vertically */
            transform: translateY(-60%); /* Fine-tune vertical centering */
            color: var(--text-light);
            font-size: 0.9em;
        }


        .form-group input:focus {
            outline: none; /* Remove default outline */
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 90, 249, 0.2); /* Focus ring */
        }

        .form-group input::placeholder {
            color: #aaa; /* Lighter placeholder text */
        }

        .button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px; /* Slightly larger padding */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05em; /* Slightly larger font */
            font-weight: 500;
            margin-top: 15px;
            transition: background-color 0.3s ease, transform 0.2s ease; /* Smooth transitions */
        }

        .button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px); /* Subtle lift effect */
        }

        .button:active {
             transform: translateY(0px); /* Press down effect */
        }


        .options {
            margin-top: 25px;
            font-size: 0.9em;
            color: var(--text-light);
            display: flex; /* Use flexbox for better alignment */
            justify-content: space-between; /* Space out the links */
            align-items: center;
            flex-wrap: wrap; /* Allow wrapping on small screens */
            gap: 10px; /* Add gap between elements */
        }

        .options a {
            color: var(--primary-color);
            text-decoration: none;
            /* margin: 0 5px; Remove margin as flex gap handles spacing */
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Style for the registration part */
        .register-prompt {
            /* No specific styles needed if using flex gap */
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>欢迎回来！</h2> <!-- Changed title -->

        <!-- Login Form -->
        <form action="/login-processing-url" method="post">
            <!-- 替换 "/login-processing-url" 为你的实际后端处理地址 -->

            <div class="form-group">
                <label for="username">用户名</label> <!-- Changed label -->
                <i class="fas fa-user"></i> <!-- User Icon -->
                <input type="text" id="username" name="username" required placeholder="请输入您的用户名"> <!-- Changed placeholder -->
            </div>

            <div class="form-group">
                <label for="password">密码</label> <!-- Changed label -->
                 <i class="fas fa-lock"></i> <!-- Lock Icon -->
                <input type="password" id="password" name="password" required placeholder="请输入您的密码"> <!-- Changed placeholder -->
            </div>

            <button type="submit" class="button">登录</button> <!-- Changed button text -->

        </form>

        <!-- Options for Login / Register -->
        <div class="options">
             <!-- Added Forgot Password link -->
             <a href="forgot-password.html">忘记密码？</a>
             <!-- Replace "forgot-password.html" with your actual forgot password page URL -->

             <div class="register-prompt"> <!-- Grouped registration text/link -->
                <span>还没有账户？</span> <a href="register.html">立即注册</a>
                <!-- Replace "register.html" with your actual registration page URL -->
            </div>
        </div>

    </div>

</body>
</html>

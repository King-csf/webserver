<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码</title> <!-- Changed title -->
    <!-- Google Font: Poppins (Keeping for potential compatibility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* --- Paste the EXACT SAME CSS styles from your login page here --- */
        :root {
            --primary-color: #6a5af9; /* A nice purple/blue */
            --primary-hover: #5444d4;
            --background-gradient-start: #e0eafc;
            --background-gradient-end: #f0f4f9;
            --text-dark: #333;
            --text-light: #666;
            --border-color: #ddd;
            --input-bg: #fdfdfd;
            --white: #fff;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            /* Consider adding a Chinese font-family first */
            font-family: 'Poppins', sans-serif, 'Microsoft YaHei', 'SimSun', sans-serif;
            /* Subtle gradient background */
            background: linear-gradient(135deg, var(--background-gradient-start), var(--background-gradient-end));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            background-color: var(--white);
            padding: 40px; /* Increased padding */
            border-radius: 12px; /* Softer edges */
            box-shadow: 0 5px 20px var(--shadow-color); /* Softer shadow */
            width: 350px; /* Slightly wider */
            text-align: center;
            transition: transform 0.3s ease; /* Add subtle transition for potential interactions */
        }

        h2 {
            margin-bottom: 25px;
            color: var(--text-dark);
            font-weight: 600; /* Bolder title */
        }

        /* Added style for paragraph */
        .description {
            color: var(--text-light);
            font-size: 0.9em;
            margin-bottom: 25px;
            margin-top: -15px; /* Adjust spacing */
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px; /* Increased spacing */
            text-align: left;
            position: relative; /* Needed for icon positioning */
        }

        .form-group label {
            display: block;
            margin-bottom: 8px; /* Increased spacing */
            color: var(--text-light);
            font-weight: 500; /* Medium weight */
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 40px; /* Add padding-left for icon */
            border: 1px solid var(--border-color);
            border-radius: 6px; /* Slightly softer radius */
            box-sizing: border-box;
            font-size: 1em;
            background-color: var(--input-bg);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Style for input icons */
        .form-group i {
            position: absolute;
            left: 15px;
            top: 70%; /* Adjust vertically */
            transform: translateY(-60%); /* Fine-tune vertical centering */
            color: var(--text-light);
            font-size: 0.9em;
        }


        .form-group input:focus {
            outline: none; /* Remove default outline */
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 90, 249, 0.2); /* Focus ring */
        }

        .form-group input::placeholder {
            color: #aaa; /* Lighter placeholder text */
        }

        .button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px; /* Slightly larger padding */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05em; /* Slightly larger font */
            font-weight: 500;
            margin-top: 15px;
            transition: background-color 0.3s ease, transform 0.2s ease; /* Smooth transitions */
        }

        .button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px); /* Subtle lift effect */
        }

        .button:active {
             transform: translateY(0px); /* Press down effect */
        }


        .options {
            margin-top: 25px;
            font-size: 0.9em;
            color: var(--text-light);
            display: flex; /* Use flexbox for better alignment */
            /* --- Changed from space-between to center for single link --- */
            justify-content: center;
            align-items: center;
            flex-wrap: wrap; /* Allow wrapping on small screens */
            gap: 10px; /* Add gap between elements */
        }

        .options a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>设置新密码</h2> <!-- Changed heading -->
        <p class="description"> <!-- Changed descriptive text -->
            请输入您的账户邮箱、用户名和新密码以重置。
        </p>

        <!-- Reset Password Form -->
        <form action="/set-new-password-processing-url" method="post"> <!-- Changed action URL -->
            <!-- 替换 "/set-new-password-processing-url" 为你的实际后端处理地址 -->

            <div class="form-group">
                <label for="email">邮箱地址</label>
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" required placeholder="请输入您的注册邮箱">
            </div>

            <div class="form-group"> <!-- Added Username Field -->
                <label for="username">用户名</label>
                <i class="fas fa-user"></i>
                <input type="text" id="username" name="username" required placeholder="请输入您的用户名">
            </div>

            <div class="form-group"> <!-- Added New Password Field -->
                <label for="new_password">新密码</label>
                <i class="fas fa-lock"></i>
                <input type="password" id="new_password" name="new_password" required placeholder="请输入您的新密码">
            </div>

            <div class="form-group"> <!-- Added Confirm New Password Field -->
                <label for="confirm_password">确认新密码</label>
                 <i class="fas fa-lock"></i>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="请再次输入新密码">
                <!-- Add JavaScript later to verify this matches new_password -->
            </div>

            <button type="submit" class="button">重置密码</button> <!-- Changed button text -->

        </form>

        <!-- Option to go back to Login -->
        <div class="options">
             <a href="login.html">返回登录</a>
             <!-- Replace "login.html" with your actual login page URL -->
        </div>

    </div>

    <!-- Optional: Basic JavaScript for password confirmation check -->
    <script>
        const form = document.querySelector('form');
        const newPassword = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');

        form.addEventListener('submit', function(event) {
            if (newPassword.value !== confirmPassword.value) {
                alert('两次输入的密码不一致，请检查！'); // Alert message in Chinese
                // Prevent form submission
                event.preventDefault();
                // Optional: Add visual feedback, like changing border color
                confirmPassword.style.borderColor = 'red';
                newPassword.style.borderColor = 'red'; // Maybe highlight both
                confirmPassword.focus(); // Focus the confirmation field
            } else {
                 // Optional: Reset border color if previously set to red
                 confirmPassword.style.borderColor = '';
                 newPassword.style.borderColor = '';
            }
        });

        // Optional: Reset border color on input change
        confirmPassword.addEventListener('input', () => {
             if (confirmPassword.style.borderColor === 'red') {
                 confirmPassword.style.borderColor = '';
                 newPassword.style.borderColor = ''; // Reset both if needed
             }
        });
         newPassword.addEventListener('input', () => {
             if (newPassword.style.borderColor === 'red') {
                 newPassword.style.borderColor = '';
                 confirmPassword.style.borderColor = ''; // Reset both if needed
             }
        });
    </script>

</body>
</html>

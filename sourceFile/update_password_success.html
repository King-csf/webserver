<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码重置成功</title> <!-- Changed title -->
    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* --- Paste the EXACT SAME CSS styles from your "Set New Password" page here --- */
        :root {
            --primary-color: #6a5af9;
            --primary-hover: #5444d4;
            --background-gradient-start: #e0eafc;
            --background-gradient-end: #f0f4f9;
            --text-dark: #333;
            --text-light: #666;
            --border-color: #ddd;
            --input-bg: #fdfdfd;
            --white: #fff;
            --shadow-color: rgba(0, 0, 0, 0.1);
            /* Added Status Colors */
            --success-color: #28a745;
            --failure-color: #dc3545;
        }

        body {
            font-family: 'Poppins', sans-serif, 'Microsoft YaHei', 'SimSun', sans-serif;
            background: linear-gradient(135deg, var(--background-gradient-start), var(--background-gradient-end));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px var(--shadow-color);
            width: 350px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        h2 {
            margin-top: 0; /* Adjust if icon is above */
            margin-bottom: 15px;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Style for paragraph messages on status pages */
        .status-message {
            color: var(--text-light);
            font-size: 0.95em; /* Slightly larger than description */
            margin-bottom: 30px; /* More space below message */
            line-height: 1.6;
        }

         /* Style for Status Icons */
         .status-icon {
            font-size: 3.5em;
            margin-bottom: 20px;
            display: block; /* Ensure it takes block space */
         }
         .success-icon {
            color: var(--success-color);
         }
         .failure-icon {
            color: var(--failure-color);
         }


        /* --- Styles for form-group, input, label, i are not needed here but kept for consistency if copy-pasting --- */
        .form-group { margin-bottom: 20px; text-align: left; position: relative; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-light); font-weight: 500; font-size: 0.9em; }
        .form-group input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 1em; background-color: var(--input-bg); transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        .form-group i { position: absolute; left: 15px; top: 70%; transform: translateY(-60%); color: var(--text-light); font-size: 0.9em; }
        .form-group input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(106, 90, 249, 0.2); }
        .form-group input::placeholder { color: #aaa; }
        /* --- End of unused form styles --- */


        .button { /* Can be used for styled links if preferred */
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05em;
            font-weight: 500;
            margin-top: 15px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .button:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .button:active { transform: translateY(0px); }


        .options {
            margin-top: 25px;
            font-size: 0.9em;
            color: var(--text-light);
            display: flex;
            justify-content: center; /* Center single link */
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .options a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Success Icon -->
        <i class="fas fa-check-circle status-icon success-icon"></i>

        <h2>密码重置成功！</h2>

        <p class="status-message"> <!-- Specific class for status message -->
            您的密码已成功更新。您现在可以使用新密码登录您的账户。
        </p>

        <!-- Option to go back to Login -->
        <div class="options">
             <a href="login.html">返回登录</a>
             <!-- Replace "login.html" with your actual login page URL -->
        </div>

        <!-- Alternative: Use button style for the link -->
        <!--
        <a href="login.html" class="button">返回登录</a>
        -->

    </div>

</body>
</html>

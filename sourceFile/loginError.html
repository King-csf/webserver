<!DOCTYPE html>
<html lang="zh-CN"> <!-- 添加语言属性 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录失败</title> <!-- 已更改标题 -->
    <!-- Google Font: Poppins (可以保留，或者换成中文字体链接，如果需要) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons (保持不变) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* --- CSS 样式与登录页面相同 --- */
        :root {
            --primary-color: #6a5af9; /* 一个漂亮的紫色/蓝色 */
            --primary-hover: #5444d4;
            --background-gradient-start: #e0eafc;
            --background-gradient-end: #f0f4f9;
            --text-dark: #333;
            --text-light: #666;
            --border-color: #ddd;
            --input-bg: #fdfdfd;
            --white: #fff;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --error-color: #dc3545; /* 添加了错误颜色 */
        }

        body {
            /* 优先使用系统默认的中文字体，Poppins 作为后备 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", 'Poppins';
            background: linear-gradient(135deg, var(--background-gradient-start), var(--background-gradient-end));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
        }

        .container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px var(--shadow-color);
            width: 380px; /* 宽度可能需要微调以适应中文 */
            text-align: center;
            transition: transform 0.3s ease;
        }

        h2 {
            margin-bottom: 25px;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* 错误消息样式 */
        .error-message {
            color: var(--error-color);
            background-color: #f8d7da; /* 浅红色背景 */
            border: 1px solid #f5c6cb; /* 微红边框 */
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 0.95em;
            text-align: left; /* 文本在框内左对齐 */
            display: flex; /* 使用 flex 进行图标对齐 */
            align-items: center; /* 垂直居中图标 */
        }

        .error-message i {
            margin-right: 10px; /* 图标和文本之间的间距 */
            font-size: 1.2em; /* 图标稍大 */
            color: var(--error-color); /* 匹配图标颜色 */
        }

        /* --- 复用按钮样式 --- */
        .button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05em;
            font-weight: 500;
            margin-top: 15px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-decoration: none; /* 用于样式化为按钮的链接 */
            display: inline-block; /* 用于样式化为按钮的链接 */
            box-sizing: border-box; /* 确保内边距不破坏宽度 */
        }

        .button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

         .button:active {
             transform: translateY(0px);
        }

        /* --- 复用选项样式 --- */
        .options {
            margin-top: 25px;
            font-size: 0.9em;
            color: var(--text-light);
        }

        .options a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 5px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        /* --- CSS 结束 --- */
    </style>
</head>
<body>

    <div class="container">
        <h2>登录失败</h2> <!-- 已更改标题 -->

        <!-- 错误信息显示 -->
        <div class="error-message">
             <i class="fas fa-exclamation-circle"></i> <!-- 错误图标 -->
            <span>
                <!-- 通用错误消息 - 如果可能，替换为后端返回的具体错误 -->
                用户名或密码错误，请检查后重试。
            </span>
        </div>

        <!-- 操作按钮 -->
        <!-- 链接回登录页面 -->
        <a href="login.html" class="button">重试</a>
        <!-- 确保 'login.html' 是您登录文件的正确名称 -->


        <!-- 忘记密码/注册选项 -->
        <div class="options">
             <a href="forgot-password.html">忘记密码？</a> <!-- 添加了忘记密码链接 -->
             <span style="margin: 0 5px;">|</span> <!-- 分隔符 -->
             <span>还没有账户？</span> <a href="register.html">立即注册</a>
             <!-- 确保 'forgot-password.html' 和 'register.html' 指向正确的文件 -->
        </div>

    </div>

</body>
</html>
